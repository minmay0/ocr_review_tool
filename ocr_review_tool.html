<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR 검수 툴</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #7c5cbf;
    --ok: #3ecf7a;
    --ng: #f75c5c;
    --warn: #f7b731;
    --text: #e8eaf0;
    --muted: #6b7194;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -.3px; }
  header h1 span { color: var(--accent); }
  .badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: .75rem;
    color: var(--muted);
  }
  .badge b { color: var(--text); }

  /* ── 설정 패널 ── */
  #setup {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 48px;
    width: 520px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .setup-card h2 { font-size: 1.1rem; font-weight: 600; }
  .setup-card p { font-size: .82rem; color: var(--muted); margin-top: 4px; }

  .field label {
    display: block;
    font-size: .8rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .file-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color .2s;
    font-size: .85rem;
  }
  .file-btn:hover { border-color: var(--accent); }
  .file-btn .icon { font-size: 1.2rem; }
  .file-btn .fname { color: var(--muted); font-size: .8rem; }
  input[type=file] { display: none; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 10px;
    font-size: .85rem;
    font-family: inherit;
    outline: none;
  }
  select:focus { border-color: var(--accent); }

  .start-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
    font-family: inherit;
  }
  .start-btn:hover { opacity: .88; }
  .start-btn:disabled { opacity: .4; cursor: default; }

  /* ── 검수 화면 ── */
  #reviewer { flex: 1; display: none; flex-direction: column; }

  /* 진행바 */
  .progress-bar-wrap {
    height: 3px;
    background: var(--surface2);
    flex-shrink: 0;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }

  /* 메인 영역 */
  .main-area {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    overflow: hidden;
  }

  /* 이미지 패널 */
  .img-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #090b10;
    overflow: hidden;
    position: relative;
  }
  .img-panel img {
    max-width: 100%;
    max-height: calc(100vh - 200px);
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .img-filename {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: .75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  .img-notfound {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .img-notfound .icon { font-size: 3rem; }

  /* 정보 패널 */
  .info-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .info-scroll { flex: 1; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 20px; }

  .counter {
    font-size: .75rem;
    color: var(--muted);
    text-align: right;
  }
  .counter b { color: var(--text); font-size: .9rem; }

  .section-label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .text-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: .9rem;
    line-height: 1.6;
    word-break: break-all;
    min-height: 60px;
  }
  .text-box.highlight { border-color: var(--accent); color: var(--accent); }

  /* 상태 배지 */
  .status-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-chip {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .78rem;
    font-weight: 600;
    border: 1.5px solid transparent;
    cursor: default;
  }
  .chip-ok  { background: rgba(62,207,122,.1); border-color: var(--ok);  color: var(--ok); }
  .chip-ng  { background: rgba(247,92,92,.1);  border-color: var(--ng);  color: var(--ng); }
  .chip-skip{ background: rgba(107,113,148,.1);border-color: var(--muted);color: var(--muted); }

  /* 메모 */
  .memo-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 12px;
    font-size: .83rem;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color .2s;
  }
  .memo-input:focus { border-color: var(--accent); }

  /* 액션 버튼 */
  .action-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn {
    padding: 10px;
    border-radius: var(--radius);
    border: 1.5px solid transparent;
    font-size: .85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-ok   { background: rgba(62,207,122,.12); border-color: var(--ok); color: var(--ok); }
  .btn-ok:hover   { background: var(--ok); color: #000; }
  .btn-ng   { background: rgba(247,92,92,.12); border-color: var(--ng); color: var(--ng); }
  .btn-ng:hover   { background: var(--ng); color: #fff; }
  .btn-skip { background: var(--surface2); border-color: var(--border); color: var(--muted); }
  .btn-skip:hover { border-color: var(--muted); color: var(--text); }

  .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 8px;
    font-size: .82rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .2s;
  }
  .btn-nav:hover { border-color: var(--accent); }

  .btn-export {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: .85rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-export:hover { opacity: .85; }

  /* 통계 미니 */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .stat-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .stat-num { font-size: 1.1rem; font-weight: 700; }
  .stat-lbl { font-size: .68rem; color: var(--muted); margin-top: 2px; }
  .c-ok { color: var(--ok); }
  .c-ng { color: var(--ng); }
  .c-sk { color: var(--muted); }

  /* 현재 결과 표시 테두리 */
  .img-panel.result-ok  { outline: 3px solid var(--ok); }
  .img-panel.result-ng  { outline: 3px solid var(--ng); }
  .img-panel.result-skip{ outline: 3px solid var(--muted); }

  /* 키보드 힌트 */
  .key-hint {
    font-size: .7rem;
    color: var(--muted);
    text-align: center;
  }
  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: .7rem;
    font-family: 'JetBrains Mono', monospace;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <h1>OCR <span>검수 툴</span></h1>
  <div class="badge" id="hdr-badge" style="display:none">
    <b id="hdr-cur">0</b> / <b id="hdr-tot">0</b>
  </div>
  <div style="flex:1"></div>
  <div class="key-hint" id="key-hint-hdr" style="display:none">
    <kbd>O</kbd> 일치 &nbsp; <kbd>X</kbd> 불일치 &nbsp; <kbd>S</kbd> 건너뛰기 &nbsp; <kbd>←</kbd><kbd>→</kbd> 이동
  </div>
</header>

<!-- 설정 화면 -->
<div id="setup">
  <div class="setup-card">
    <div>
      <h2>🔧 검수 설정</h2>
      <p>이미지 폴더와 엑셀 파일을 선택하고 열을 지정하세요.</p>
    </div>

    <div class="field">
      <label>🖼️ 이미지 소스</label>
      <div class="file-btn" onclick="document.getElementById('zipInput').click()">
        <span class="icon">📦</span>
        <span id="zip-name" class="fname">ZIP 파일 선택 (압축 해제 불필요)</span>
      </div>
      <input type="file" id="zipInput" accept=".zip" onchange="loadZip(this)">
      <div style="font-size:.75rem;color:var(--muted);margin:8px 0;text-align:center;">또는</div>
      <div class="file-btn" onclick="document.getElementById('folderInput').click()">
        <span class="icon">📁</span>
        <span id="folder-name" class="fname">이미지 폴더 선택</span>
      </div>
      <input type="file" id="folderInput" webkitdirectory multiple accept="image/*" onchange="loadFolder(this)">
    </div>

    <div class="field">
      <label>📊 엑셀 파일 (.xlsx / .xls)</label>
      <div class="file-btn" onclick="document.getElementById('excelInput').click()">
        <span class="icon">📋</span>
        <span id="excel-name" class="fname">엑셀 파일 선택</span>
      </div>
      <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" onchange="loadExcel(this)">
    </div>

    <div class="row2" id="col-selects" style="display:none">
      <div class="field">
        <label>파일명 열</label>
        <select id="col-filename"></select>
      </div>
      <div class="field">
        <label>텍스트(정답) 열</label>
        <select id="col-text"></select>
      </div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startReview()" disabled>검수 시작 →</button>
  </div>
</div>

<!-- 검수 화면 -->
<div id="reviewer">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="prog-fill" style="width:0%"></div>
  </div>
  <div class="main-area">
    <!-- 이미지 -->
    <div class="img-panel" id="img-panel">
      <img id="preview-img" src="" alt="">
      <div class="img-filename" id="img-fname"></div>
    </div>

    <!-- 정보 -->
    <div class="info-panel">
      <div class="info-scroll">
        <div class="counter">
          <b id="cur-idx">1</b> / <b id="tot-cnt">1</b>
        </div>

        <!-- 통계 -->
        <div>
          <div class="section-label">진행 현황</div>
          <div class="stat-row">
            <div class="stat-item"><div class="stat-num c-ok" id="s-ok">0</div><div class="stat-lbl">✅ 일치</div></div>
            <div class="stat-item"><div class="stat-num c-ng" id="s-ng">0</div><div class="stat-lbl">❌ 불일치</div></div>
            <div class="stat-item"><div class="stat-num c-sk" id="s-sk">0</div><div class="stat-lbl">⭕ 건너뜀</div></div>
          </div>
        </div>

        <!-- 파일명 -->
        <div>
          <div class="section-label">파일명</div>
          <div class="text-box" id="cell-fname" style="font-family:'JetBrains Mono',monospace;font-size:.8rem;"></div>
        </div>

        <!-- 엑셀 텍스트 -->
        <div>
          <div class="section-label">엑셀 텍스트 (정답)</div>
          <div class="text-box highlight" id="cell-text"></div>
        </div>

        <!-- 현재 판정 -->
        <div>
          <div class="section-label">현재 판정</div>
          <div class="status-row" id="status-row">
            <span class="status-chip chip-skip">미판정</span>
          </div>
        </div>

        <!-- 메모 -->
        <div>
          <div class="section-label">메모 (선택)</div>
          <textarea class="memo-input" id="memo-input" rows="2" placeholder="오류 내용 등 메모..."></textarea>
        </div>
      </div>

      <div class="action-area">
        <div class="action-row">
          <button class="btn btn-ok"   onclick="judge('ok')">✅ 일치 (O)</button>
          <button class="btn btn-ng"   onclick="judge('ng')">❌ 불일치 (X)</button>
        </div>
        <button class="btn btn-skip"   onclick="judge('skip')">⭕ 건너뛰기 (S)</button>
        <div class="nav-row">
          <button class="btn-nav" onclick="move(-1)">← 이전</button>
          <button class="btn-nav" onclick="move(1)">다음 →</button>
        </div>
        <button class="btn-export" onclick="exportResult()">📥 결과 엑셀 저장</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── 상태 ───
let imageMap = {};     // filename → objectURL (캐시)
let zipEntries = {};   // filename → JSZip entry (lazy)
let rows = [];
let results = [];
let cur = 0;

function normalizeKey(name) {
  return name.split(/[\\/]/).pop().toLowerCase().trim();
}

// ─── 폴더 로드 ───
function loadFolder(input) {
  imageMap = {};
  zipEntries = {};
  const files = [...input.files].filter(f => f.type.startsWith('image/'));
  files.forEach(f => {
    const url = URL.createObjectURL(f);
    imageMap[f.name] = url;
    imageMap[normalizeKey(f.name)] = url;
    if (f.webkitRelativePath) imageMap[f.webkitRelativePath] = url;
  });
  document.getElementById('folder-name').textContent = `${files.length}개 이미지 로드됨`;
  document.getElementById('zip-name').textContent = 'ZIP 파일 선택 (압축 해제 불필요)';
  checkReady();
}

// ─── ZIP 로드 (압축 해제 없이 직접 읽기) ───
async function loadZip(input) {
  const file = input.files[0];
  if (!file) return;
  const nameEl = document.getElementById('zip-name');
  nameEl.textContent = 'ZIP 분석 중...';
  try {
    const zip = await JSZip.loadAsync(file);
    imageMap = {};
    zipEntries = {};
    const imgExt = /\.(jpg|jpeg|png|gif|bmp|webp)$/i;
    zip.forEach((path, entry) => {
      if (!entry.dir && imgExt.test(path)) {
        zipEntries[normalizeKey(path)] = entry;
        zipEntries[path] = entry;
      }
    });
    const cnt = Object.keys(zipEntries).length / 2;
    nameEl.textContent = `${Math.round(cnt).toLocaleString()}개 이미지 발견 (${file.name})`;
    document.getElementById('folder-name').textContent = '이미지 폴더 선택';
    checkReady();
  } catch (e) {
    nameEl.textContent = `오류: ${e.message}`;
  }
}

// ─── 엑셀 로드 ───
function loadExcel(input) {
  const f = input.files[0];
  if (!f) return;
  document.getElementById('excel-name').textContent = f.name;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const headers = data[0] || [];

    const fnSel = document.getElementById('col-filename');
    const txSel = document.getElementById('col-text');
    fnSel.innerHTML = '';
    txSel.innerHTML = '';
    headers.forEach((h, i) => {
      const o1 = new Option(h || `열 ${i+1}`, i);
      const o2 = new Option(h || `열 ${i+1}`, i);
      fnSel.add(o1); txSel.add(o2);
    });
    // 기본값 추측
    const fnIdx = headers.findIndex(h => /file|name|파일|이름/i.test(h));
    const txIdx = headers.findIndex(h => /text|label|글자|텍스트|정답/i.test(h));
    if (fnIdx >= 0) fnSel.value = fnIdx;
    if (txIdx >= 0) txSel.value = txIdx;

    document.getElementById('col-selects').style.display = 'grid';

    // 행 저장 (헤더 제외)
    rows = data.slice(1).map(r => ({
      filename: String(r[fnSel.value] ?? '').trim(),
      text: String(r[txSel.value] ?? '').trim(),
      _raw: r
    }));

    // 열 변경 시 재파싱
    [fnSel, txSel].forEach(sel => sel.addEventListener('change', () => {
      rows = data.slice(1).map(r => ({
        filename: String(r[fnSel.value] ?? '').trim(),
        text: String(r[txSel.value] ?? '').trim(),
        _raw: r
      }));
    }));

    checkReady();
  };
  reader.readAsArrayBuffer(f);
}

function checkReady() {
  const hasImg = Object.keys(imageMap).length > 0 || Object.keys(zipEntries).length > 0;
  document.getElementById('start-btn').disabled = !(hasImg && rows.length > 0);
}

// ─── 검수 시작 ───
function startReview() {
  results = rows.map(r => ({ ...r, result: null, memo: '' }));
  cur = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('reviewer').style.display = 'flex';
  document.getElementById('hdr-badge').style.display = '';
  document.getElementById('key-hint-hdr').style.display = '';
  document.getElementById('tot-cnt').textContent = results.length;
  document.getElementById('hdr-tot').textContent = results.length;
  render();
}

// ─── 렌더링 ───
async function render() {
  const r = results[cur];
  const panel = document.getElementById('img-panel');
  const img = document.getElementById('preview-img');
  const nk = normalizeKey(r.filename);

  // 캐시 또는 ZIP lazy load
  let url = imageMap[r.filename] || imageMap[nk];
  if (!url) {
    const entry = zipEntries[r.filename] || zipEntries[nk];
    if (entry) {
      const blob = await entry.async('blob');
      url = URL.createObjectURL(blob);
      imageMap[r.filename] = url;
      imageMap[nk] = url;
    }
  }

  if (url) {
    img.src = url;
    img.style.display = '';
    panel.querySelector('.img-notfound')?.remove();
  } else {
    img.src = ''; img.style.display = 'none';
    if (!panel.querySelector('.img-notfound')) {
      const div = document.createElement('div');
      div.className = 'img-notfound';
      div.innerHTML = `<div class="icon">🖼️</div><div>${r.filename}</div><div style="font-size:.75rem;color:var(--muted)">이미지를 찾을 수 없습니다</div>`;
      panel.appendChild(div);
    } else {
      panel.querySelector('.img-notfound div:nth-child(2)').textContent = r.filename;
    }
  }

  panel.className = 'img-panel' + (r.result ? ` result-${r.result}` : '');
  document.getElementById('img-fname').textContent = r.filename;
  document.getElementById('cell-fname').textContent = r.filename;
  document.getElementById('cell-text').textContent = r.text;
  document.getElementById('memo-input').value = r.memo || '';
  document.getElementById('cur-idx').textContent = cur + 1;
  document.getElementById('hdr-cur').textContent = cur + 1;

  const statusRow = document.getElementById('status-row');
  if (!r.result) {
    statusRow.innerHTML = '<span class="status-chip chip-skip">미판정</span>';
  } else if (r.result === 'ok') {
    statusRow.innerHTML = '<span class="status-chip chip-ok">✅ 일치</span>';
  } else if (r.result === 'ng') {
    statusRow.innerHTML = '<span class="status-chip chip-ng">❌ 불일치</span>';
  } else {
    statusRow.innerHTML = '<span class="status-chip chip-skip">⭕ 건너뜀</span>';
  }

  const done = results.filter(x => x.result !== null).length;
  document.getElementById('prog-fill').style.width = (done / results.length * 100) + '%';
  document.getElementById('s-ok').textContent = results.filter(x => x.result === 'ok').length;
  document.getElementById('s-ng').textContent = results.filter(x => x.result === 'ng').length;
  document.getElementById('s-sk').textContent = results.filter(x => x.result === 'skip').length;
}

// ─── 판정 ───
async function judge(val) {
  const r = results[cur];
  r.result = val;
  r.memo = document.getElementById('memo-input').value;
  await render();
  if (cur < results.length - 1) setTimeout(() => move(1), 150);
}

async function move(dir) {
  results[cur].memo = document.getElementById('memo-input').value;
  cur = Math.max(0, Math.min(results.length - 1, cur + dir));
  await render();
}

// ─── 결과 저장 ───
function exportResult() {
  const data = [['파일명', '엑셀 텍스트', '판정', '메모']];
  results.forEach(r => {
    const label = r.result === 'ok' ? '일치' : r.result === 'ng' ? '불일치' : r.result === 'skip' ? '건너뜀' : '미판정';
    data.push([r.filename, r.text, label, r.memo || '']);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:30},{wch:40},{wch:10},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '검수결과');
  XLSX.writeFile(wb, `ocr_review_result_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ─── 키보드 단축키 ───
document.addEventListener('keydown', async e => {
  if (document.getElementById('reviewer').style.display === 'none') return;
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'o' || e.key === 'O') await judge('ok');
  else if (e.key === 'x' || e.key === 'X') await judge('ng');
  else if (e.key === 's' || e.key === 'S') await judge('skip');
  else if (e.key === 'ArrowRight') await move(1);
  else if (e.key === 'ArrowLeft')  await move(-1);
});
</script>
</body>
</html>
